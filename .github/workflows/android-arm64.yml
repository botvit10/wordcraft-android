name: WordCraft Android ARM64
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          cargo +1.99.0 install cargo-apk --version '=0.10.0' --locked
      - name: Install Android packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Assemble, test, package and verify
        run: scripts/ci-arm64.sh "$RUNNER_TEMP/wordcraft"
      - name: Upload signed test APK, checksum and notices
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wordcraft-arm64-test
          path: ${{ runner.temp }}/wordcraft/artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Exercise keyboard history and image URI results on Android 35
        timeout-minutes: 18
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdk" 'emulator' 'system-images;android-35;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n wordcraft-test -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" @wordcraft-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/wordcraft/test.keystore"
          scripts/test-device.sh "$RUNNER_TEMP/wordcraft/artifact/wordcraft-arm64-test.apk" "$RUNNER_TEMP/instrumentation"
